<!-- Inicio — bienvenida y punto de partida del estudio -->
<div data-modulo="home">
  <p class="subsaludo" data-fecha>
    Tu rincón para estudiar las canciones del coro <strong>Bihotsak</strong> a tu ritmo.
  </p>

  <div class="hoy" data-hoy hidden>
    <span class="hoy__punto" aria-hidden="true"></span>
    <span class="hoy__texto" data-hoy-texto></span>
  </div>

  <button class="tarjeta tarjeta--destacada" type="button" data-continuar disabled>
    <span class="tarjeta__icono" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5a1 1 0 0 1 1.53-.85l12 7.5a1 1 0 0 1 0 1.7l-12 7.5A1 1 0 0 1 7 19.5z"/></svg></span>
    <span class="tarjeta__cuerpo">
      <span class="tarjeta__eyebrow" data-continuar-eyebrow>Seguir estudiando</span>
      <span class="tarjeta__titulo" data-continuar-titulo>Aún no hay ninguna canción</span>
    </span>
  </button>

  <h2 class="seccion-titulo">Esta semana</h2>
  <div class="semana" data-semana aria-hidden="true"></div>
  <div class="racha stagger">
    <div class="racha__dato">
      <span class="racha__num" data-num-racha>0</span>
      <span class="racha__label" data-racha-label>días seguidos</span>
    </div>
    <div class="racha__dato">
      <span class="racha__num" data-num-canciones>0</span>
      <span class="racha__label">canciones en tu repertorio</span>
    </div>
  </div>

  <section class="repasar" data-repasar hidden>
    <h2 class="seccion-titulo">Repasar lo difícil</h2>
    <div class="lista" data-repasar-lista></div>
  </section>

  <section class="coro-post" data-coro hidden>
    <h2 class="seccion-titulo">Del coro</h2>
    <a class="coro-post__card" data-coro-enlace href="#" target="_blank" rel="noopener noreferrer">
      <span class="coro-post__media" data-coro-media>
        <img class="coro-post__img" data-coro-img alt="" loading="lazy">
      </span>
      <span class="coro-post__cuerpo">
        <span class="coro-post__texto" data-coro-texto></span>
        <span class="coro-post__pie">
          <span class="coro-post__marca">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
            <span data-coro-usuario>@bihotsak</span>
          </span>
          <span class="coro-post__fecha" data-coro-fecha></span>
        </span>
      </span>
    </a>
  </section>

  <div class="vacio" data-vacio>
    <span class="vacio__icono" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
    <p>Ve a <strong>Canciones</strong> y toca <strong>+</strong> para añadir tu primera canción.</p>
  </div>
</div>

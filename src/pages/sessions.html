<!-- Sesiones — grabaciones de los ensayos del coro -->
<div class="sesiones" data-modulo="sessions">

  <!-- Acceso al repertorio (canciones con letra, partitura y estado).
       Anclado arriba: siempre a mano por muchas sesiones que haya. -->
  <button class="enlace-bloque enlace-bloque--anclado" type="button" data-ir-repertorio hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
    </svg>
    <span>Ver el repertorio</span>
    <svg class="enlace-bloque__flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
  </button>

  <!-- Filtrar sesiones por rango de fechas (oculto si hay una sola) -->
  <div class="filtro-rango" hidden data-filtro>
    <div class="filtro-rango__cab">
      <button class="filtro-rango__barra" type="button" data-abrir aria-expanded="false">
        <svg class="filtro-rango__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>
        </svg>
        <span class="filtro-rango__txt" data-resumen>Filtrar por fecha</span>
        <svg class="filtro-rango__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <button class="filtro-rango__quitar" type="button" data-quitar hidden aria-label="Quitar filtro de fecha">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="filtro-rango__panel" data-panel>
      <div class="filtro-rango__tabs" role="tablist">
        <button type="button" class="filtro-rango__tab is-activa" data-tab="desde" role="tab">
          <span>Desde</span><b data-val="desde">cualquiera</b>
        </button>
        <button type="button" class="filtro-rango__tab" data-tab="hasta" role="tab">
          <span>Hasta</span><b data-val="hasta">cualquiera</b>
        </button>
      </div>

      <div class="cal filtro-rango__cal" data-cal>
        <div class="cal__cab">
          <button class="cal__nav" type="button" data-prev aria-label="Mes anterior">‹</button>
          <span class="cal__mes" data-mes></span>
          <button class="cal__nav" type="button" data-next aria-label="Mes siguiente">›</button>
        </div>
        <div class="cal__semana"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
        <div class="cal__grid" data-grid></div>
      </div>

      <div class="filtro-rango__presets">
        <button type="button" class="filtro-chip" data-preset="mes">Este mes</button>
        <button type="button" class="filtro-chip" data-preset="anio">Este año</button>
        <button type="button" class="filtro-chip" data-preset="todo">Todo</button>
      </div>
    </div>

    <p class="ses-buscar__cuenta" data-cuenta hidden></p>
  </div>

  <!-- Aquí se pinta la lista o el estado vacío -->
  <div data-contenido></div>

  <!-- Botón flotante para añadir sesión -->
  <button class="fab" type="button" aria-label="Añadir sesión" data-nueva>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

  <!-- Formulario de alta / edición de sesión -->
  <div class="hoja" hidden data-hoja>
    <div class="hoja__fondo" data-cerrar></div>
    <form class="hoja__panel" data-form novalidate>
      <div class="hoja__asa" aria-hidden="true"></div>
      <h2 class="hoja__titulo" data-form-titulo>Nueva sesión</h2>

      <div class="campo">
        <span class="campo__label">Fecha del ensayo</span>
        <div data-fecha-picker></div>
      </div>

      <label class="campo">
        <span class="campo__label">Lugar <span class="campo__opcional">(opcional)</span></span>
        <input name="lugar" type="text" maxlength="120" autocomplete="off" placeholder="Local del coro, iglesia…" />
      </label>

      <label class="campo">
        <span class="campo__label">Notas <span class="campo__opcional">(opcional)</span></span>
        <textarea name="notas" rows="2" maxlength="2000" placeholder="Lo que quieras recordar de este ensayo"></textarea>
      </label>

      <div class="campo">
        <span class="campo__label">Audio del ensayo</span>
        <div class="archivo-fila" data-fila="audio">
          <svg class="archivo-fila__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <span class="archivo-fila__txt" data-nombre="audio">Audio (MP3, M4A…)</span>
          <label class="archivo-fila__accion">Añadir
            <input type="file" accept="audio/*,.mp3,.m4a,.ogg,.wav" data-input="audio" hidden />
          </label>
          <button type="button" class="archivo-fila__quitar" data-quitar="audio" hidden>Quitar</button>
        </div>
      </div>

      <div class="hoja__acciones">
        <button type="button" class="btn btn--fantasma" data-borrar hidden>Eliminar</button>
        <button type="button" class="btn btn--texto" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn--primario">Guardar</button>
      </div>
    </form>
  </div>

</div>

<!-- Canciones — biblioteca del repertorio (Fase 3) -->
<div class="canciones" data-modulo="songs">

  <!-- Buscador (oculto mientras no haya canciones) -->
  <label class="buscador" hidden data-buscador>
    <svg class="buscador__lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input type="search" placeholder="Buscar por título o compositor" aria-label="Buscar canción" data-input-buscar />
  </label>

  <!-- Aquí se pinta la lista o el estado vacío -->
  <div data-contenido></div>

  <!-- Botón flotante para añadir -->
  <button class="fab" type="button" aria-label="Añadir canción" data-nueva>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>

  <!-- Formulario de alta / edición -->
  <div class="hoja" hidden data-hoja>
    <div class="hoja__fondo" data-cerrar></div>
    <form class="hoja__panel" data-form novalidate>
      <div class="hoja__asa" aria-hidden="true"></div>
      <h2 class="hoja__titulo" data-form-titulo>Nueva canción</h2>

      <label class="campo">
        <span class="campo__label">Título</span>
        <input name="titulo" type="text" required maxlength="120" autocomplete="off" />
      </label>

      <label class="campo">
        <span class="campo__label">Compositor <span class="campo__opcional">(opcional)</span></span>
        <input name="compositor" type="text" maxlength="120" autocomplete="off" />
      </label>

      <fieldset class="campo">
        <legend class="campo__label">Estado</legend>
        <div class="segmentado" role="radiogroup">
          <label><input type="radio" name="estado" value="pendiente" checked /><span>Pendiente</span></label>
          <label><input type="radio" name="estado" value="progreso" /><span>En progreso</span></label>
          <label><input type="radio" name="estado" value="aprendida" /><span>Aprendida</span></label>
        </div>
      </fieldset>

      <label class="campo">
        <span class="campo__label">Notas <span class="campo__opcional">(opcional)</span></span>
        <textarea name="notas" rows="3" maxlength="2000" placeholder="Lo que quieras recordar de esta canción"></textarea>
      </label>

      <label class="campo">
        <span class="campo__label">Letra <span class="campo__opcional">(texto, opcional)</span></span>
        <textarea name="letraTexto" rows="4" maxlength="8000" placeholder="Pega o escribe aquí la letra"></textarea>
      </label>

      <div class="campo">
        <span class="campo__label">Archivos <span class="campo__opcional">(opcional)</span></span>

        <div class="archivo-fila" data-fila="letra">
          <svg class="archivo-fila__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3v5h5"/><path d="M6 3h9l5 5v13H6z"/><path d="M9 13h6M9 17h6"/></svg>
          <span class="archivo-fila__txt" data-nombre="letra">Letra (PDF, imagen o texto)</span>
          <label class="archivo-fila__accion">Añadir
            <input type="file" accept="application/pdf,.pdf,image/*,text/plain,.txt" data-input="letra" hidden />
          </label>
          <button type="button" class="archivo-fila__quitar" data-quitar="letra" hidden>Quitar</button>
        </div>

        <div class="archivo-fila" data-fila="partitura">
          <svg class="archivo-fila__ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 15 5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="9" r="1.5"/></svg>
          <span class="archivo-fila__txt" data-nombre="partitura">Partitura (imagen o PDF)</span>
          <label class="archivo-fila__accion">Añadir
            <input type="file" accept="image/*,application/pdf,.pdf" data-input="partitura" hidden />
          </label>
          <button type="button" class="archivo-fila__quitar" data-quitar="partitura" hidden>Quitar</button>
        </div>
      </div>

      <div class="hoja__acciones">
        <button type="button" class="btn btn--fantasma" data-borrar hidden>Eliminar</button>
        <button type="button" class="btn btn--texto" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn--primario">Guardar</button>
      </div>
    </form>
  </div>

</div>

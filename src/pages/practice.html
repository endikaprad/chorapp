<!-- Práctica — calendario y estadísticas (Fase 6) -->
<div class="practica" data-modulo="practice">

  <div class="racha-hero stagger" data-racha-hero>
    <div class="racha-hero__llama" data-llama>
      <svg class="racha-hero__fuego" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2c.6 3.2-1.4 4.9-2.9 6.6C7.5 10.5 6 12.3 6 15a6 6 0 0 0 12 0c0-2.2-1-3.9-2.1-5.4-.3 1-1 1.8-2 2.1.7-2.2.2-4.6-1.9-6.4C11.4 4.6 11.9 3.2 12 2Z"/>
      </svg>
      <span class="racha-hero__num" data-racha>0</span>
    </div>
    <p class="racha-hero__label" data-racha-label>días seguidos</p>
    <p class="racha-hero__msg" data-racha-msg></p>
    <div class="racha-hero__semana semana" data-semana></div>
    <div class="racha-hero__pie">
      <span data-semana-stat></span>
      <span data-record hidden></span>
      <span class="racha-hero__escudos" data-escudos hidden></span>
    </div>
  </div>

  <button class="tarjeta practica__repasar stagger" type="button" data-repasar hidden>
    <span class="tarjeta__cuerpo">
      <span class="tarjeta__titulo" data-repasar-titulo></span>
      <span class="repasar__nota" data-repasar-nota></span>
    </span>
    <span class="chip chip--progreso">Repasar</span>
  </button>

  <h2 class="seccion-titulo">Tu mes</h2>
  <div class="tarjeta-lisa">
    <div data-calendario></div>
  </div>

  <button class="btn-concierto" type="button" data-ir-conciertos>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span data-ir-conciertos-txt>Conciertos del coro</span>
    <svg class="btn-concierto__flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
  </button>

  <ul class="practica__datos" data-datos hidden></ul>

  <button class="btn-mes" type="button" data-resumen-mes hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
    <span data-resumen-mes-texto>Ver el resumen del mes</span>
    <svg class="btn-mes__flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
  </button>

  <section class="logros" data-logros hidden>
    <div class="logros__cab">
      <h2 class="seccion-titulo">Logros</h2>
      <span class="logros__cuenta" data-logros-cuenta></span>
    </div>
    <div class="logros__barra"><i data-logros-barra style="width:0"></i></div>
    <div class="logros__grid" data-logros-grid></div>
  </section>

  <div class="vacio" data-vacio hidden>
    <span class="vacio__icono" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18"/><path d="M8 2.5v4M16 2.5v4"/></svg></span>
    <p>Aún no has registrado ninguna sesión. Abre una canción en <strong>Canciones</strong> y empieza a estudiar.</p>
  </div>

</div>

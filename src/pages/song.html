<!-- Canción del repertorio — ficha con estado, notas y ensayos -->
<div class="cancion-vista" data-modulo="song">

  <div class="estudio__cab">
    <div class="estudio__id">
      <h2 class="estudio__titulo" data-titulo>—</h2>
      <p class="estudio__meta" data-meta hidden></p>
    </div>
    <button class="chip chip--boton" type="button" data-chip aria-label="Cambiar estado">
      <span data-chip-txt>—</span>
      <svg class="chip__flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button class="estudio__editar" type="button" aria-label="Editar canción" data-editar>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
      </svg>
    </button>
  </div>

  <p class="cancion-vista__notas" data-notas hidden></p>

  <div class="cancion-vista__tiene" data-tiene hidden></div>

  <h3 class="seccion-titulo">Ensayada en</h3>
  <div class="marcas-lista" data-ensayos></div>

</div>

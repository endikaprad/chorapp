<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1512D6" />
  <meta name="description" content="App de estudio de Maite para el coro Bihotsak." />
  <title>ChorApp · Bihotsak</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Cabecera contextual (saludo en Inicio, título + atrás en el resto) -->
  <header id="app-header" class="app-header">
    <button id="btn-atras" class="header-back" aria-label="Volver" hidden>‹</button>
    <h1 id="header-titulo" class="header-titulo">Hola, Maite <span class="emoji" aria-hidden="true">🎶</span></h1>
  </header>

  <!-- Contenedor donde se renderiza cada pantalla -->
  <main id="vista" class="vista" role="main"></main>

  <!-- Navegación inferior -->
  <nav id="bottom-nav" class="bottom-nav" aria-label="Navegación principal">
    <button class="nav-item is-activa" data-ruta="inicio" aria-current="page">
      <span class="nav-icono" aria-hidden="true">🏠</span>
      <span class="nav-texto">Inicio</span>
    </button>
    <button class="nav-item" data-ruta="canciones">
      <span class="nav-icono" aria-hidden="true">🎵</span>
      <span class="nav-texto">Canciones</span>
    </button>
    <button class="nav-item" data-ruta="practica">
      <span class="nav-icono" aria-hidden="true">📅</span>
      <span class="nav-texto">Práctica</span>
    </button>
    <button class="nav-item" data-ruta="grabaciones">
      <span class="nav-icono" aria-hidden="true">🎙️</span>
      <span class="nav-texto">Grabaciones</span>
    </button>
    <span id="nav-indicador" class="nav-indicador" aria-hidden="true"></span>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/player.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

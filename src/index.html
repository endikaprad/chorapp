<head>
  <meta charset="UTF-8" />

  <meta name="theme-color" content="#FBF8F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#12100E" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="App de estudio de Maite para el coro Bihotsak." />
  <title>ChorApp</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- La fuente se carga SIN bloquear el primer pintado: en el móvil, con
       conexión lenta, esperar a Google Fonts congelaba el arranque. Hasta que
       llega, se ve la fuente de sistema (font-display: swap). -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" /></noscript>

  <!-- Tema aplicado ANTES de pintar (sin destello) y con data-theme
       explícito: los WebView que fuerzan su propio modo oscuro y no
       propagan prefers-color-scheme dejaban la app a medio teñir. -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem('chorapp:tema');
        var oscuro = v === 'oscuro' ||
          ((v === 'auto' || !v) && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Fondo animado cálido con auroras cobalto (decorativo) -->
  <div class="fondo-animado" aria-hidden="true">
    <span class="fondo-lineas"></span>
    <span class="fondo-orbe fondo-orbe--1"></span>
    <span class="fondo-orbe fondo-orbe--2"></span>
    <span class="fondo-orbe fondo-orbe--3"></span>
  </div>

  <!-- Escenografía de cada fecha señalada — vive FUERA de .fondo-animado
       a propósito: ese contenedor anima su propio transform, y eso lo
       convierte en el "containing block" de cualquier position:fixed
       de dentro (deja de colocarse respecto a la pantalla real). Aquí
       fuera, cada elemento fixed sí se coloca contra el viewport.
       Todo oculto salvo en su body.tema-* (o body.cumple-maite): ver
       "Fechas señaladas" en styles.css para el detalle de cada una. -->
  <div class="fondo-decor" aria-hidden="true">
    <!-- Partículas: confeti / nieve / estrellas / murciélagos / pétalos.
         --x/--y/--d/--t son la posición y el ritmo base; cada tema pone
         encima forma, color y el tipo de movimiento. -->
    <span class="fondo-confeti">
      <i style="--x:2%;  --y:6%;  --d:8.2s;  --t:0s;"></i>
      <i style="--x:12%; --y:82%; --d:9.4s;  --t:1.1s;"></i>
      <i style="--x:22%; --y:18%; --d:7.6s;  --t:3.4s;"></i>
      <i style="--x:32%; --y:90%; --d:10s;   --t:2.2s;"></i>
      <i style="--x:42%; --y:34%; --d:8.8s;  --t:5.6s;"></i>
      <i style="--x:52%; --y:64%; --d:9.9s;  --t:0.6s;"></i>
      <i style="--x:62%; --y:10%; --d:7.9s;  --t:4.2s;"></i>
      <i style="--x:72%; --y:76%; --d:9.2s;  --t:1.8s;"></i>
      <i style="--x:82%; --y:48%; --d:8.4s;  --t:6.4s;"></i>
      <i style="--x:92%; --y:24%; --d:10.4s; --t:2.8s;"></i>
      <i style="--x:7%;  --y:58%; --d:8.6s;  --t:7.2s;"></i>
      <i style="--x:27%; --y:4%;  --d:9.6s;  --t:0.2s;"></i>
      <i style="--x:47%; --y:70%; --d:8s;    --t:3.9s;"></i>
      <i style="--x:67%; --y:40%; --d:9.1s;  --t:5.1s;"></i>
      <i style="--x:87%; --y:86%; --d:7.4s;  --t:1.4s;"></i>
      <i style="--x:97%; --y:14%; --d:10.2s; --t:4.8s;"></i>
    </span>

    <span class="fondo-marca" aria-hidden="true"></span>

    <span class="fondo-guirnalda" aria-hidden="true">
      <i style="--gx:3%;  --gy:10px; --gt:.1s;"></i><i style="--gx:12%; --gy:30px; --gt:.6s;"></i>
      <i style="--gx:21%; --gy:30px; --gt:1.1s;"></i><i style="--gx:30%; --gy:10px; --gt:1.6s;"></i>
      <i style="--gx:39%; --gy:10px; --gt:.3s;"></i><i style="--gx:48%; --gy:32px; --gt:.8s;"></i>
      <i style="--gx:57%; --gy:32px; --gt:1.3s;"></i><i style="--gx:66%; --gy:10px; --gt:1.8s;"></i>
      <i style="--gx:75%; --gy:10px; --gt:.5s;"></i><i style="--gx:84%; --gy:30px; --gt:1s;"></i>
      <i style="--gx:93%; --gy:30px; --gt:1.5s;"></i><i style="--gx:100%; --gy:8px; --gt:2s;"></i>
    </span>

    <span class="fondo-telaranas" aria-hidden="true">
      <svg class="telarana telarana--izq" viewBox="0 0 120 120"><g>
        <path d="M0 0 L120 60 M0 0 L90 90 M0 0 L60 110 M0 0 L20 118"/>
        <path d="M6 3 Q 30 20 22 44 Q 52 34 60 56 Q 40 70 44 96 Q 20 84 8 100"/>
      </g></svg>
      <svg class="telarana telarana--der" viewBox="0 0 120 120"><g>
        <path d="M120 0 L0 50 M120 0 L34 84 M120 0 L64 108 M120 0 L100 118"/>
        <path d="M114 3 Q 92 18 100 40 Q 70 32 62 52 Q 84 66 78 90 Q 100 80 110 96"/>
      </g></svg>
      <i class="arana" aria-hidden="true"></i>
    </span>
    <span class="fondo-niebla" aria-hidden="true"><i></i><i></i><i></i></span>

    <span class="fondo-cometa" aria-hidden="true"><i></i><i></i></span>

    <span class="fondo-globos" aria-hidden="true">
      <i class="globo globo--1"><b></b></i>
      <i class="globo globo--2"><b></b></i>
      <i class="globo globo--3"><b></b></i>
    </span>

    <span class="fondo-mariposas" aria-hidden="true">
      <i></i><i></i><i></i>
    </span>

    <span class="fondo-fuegos" aria-hidden="true">
      <span class="fuego fuego--1">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </span>
      <span class="fuego fuego--2">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </span>
    </span>
  </div>

  <!-- Cabecera contextual (saludo en Inicio, título + atrás en el resto) -->

    <button id="btn-atras" class="header-back" aria-label="Volver" hidden>‹</button>
    <h1 id="header-titulo" class="header-titulo">Kaixo, Ama <span class="marca-logo" aria-hidden="true"><svg viewBox="0 0 512 512" fill="none"><g class="marca-logo__trazo" stroke="currentColor" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"><path class="marca-logo__p" d="M256 168C232 112 178 92 138 118C92 148 88 214 128 262L256 398L300 354"/><path class="marca-logo__p" d="M256 168C280 112 334 92 374 118C420 148 424 214 384 262L330 316"/><path class="marca-logo__p marca-logo__p--rizo" d="M300 354C344 330 356 388 322 408C292 426 262 402 274 366C282 344 312 340 322 362"/></g><circle class="marca-logo__punto" cx="410" cy="150" r="21" fill="currentColor"/><circle class="marca-logo__punto marca-logo__punto--2" cx="410" cy="206" r="21" fill="currentColor"/></svg></span></h1>
    <div class="header-acciones">
      <button id="btn-backup" class="header-backup" type="button" aria-label="Copia de seguridad" title="Copia de seguridad">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-1-8.9 5.5 5.5 0 0 1 10.7-2A4.5 4.5 0 0 1 17 18H7Z"/><path d="M12 11v7M9.5 15.5 12 18l2.5-2.5"/></svg>
      </button>
      <button id="btn-tema" class="header-tema" type="button" aria-label="Cambiar tema"></button>
    </div>
  </header>

  <!-- Contenedor donde se renderiza cada pantalla -->
  <main id="vista" class="vista" role="main"></main>

  <!-- Marco rojo global + botón de parada mientras se graba (los gestiona recorder.js) -->

  <button id="btn-parar-grabando" type="button" aria-label="Detener grabación">
    <span class="punto" aria-hidden="true"></span>
    <span data-parar-txt>0:00</span>
  </button>

      </svg>

    <button class="nav-item" data-ruta="grabaciones">

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF8F3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#12100E" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="App de estudio de Maite para el coro Bihotsak." />
  <title>ChorApp</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- La fuente se carga SIN bloquear el primer pintado: en el móvil, con
       conexión lenta, esperar a Google Fonts congelaba el arranque. Hasta que
       llega, se ve la fuente de sistema (font-display: swap). -->
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" /></noscript>

  <!-- Tema aplicado ANTES de pintar (sin destello) y con data-theme
       explícito: los WebView que fuerzan su propio modo oscuro y no
       propagan prefers-color-scheme dejaban la app a medio teñir. -->
  <script>
    (function () {
      try {
        var v = localStorage.getItem('chorapp:tema');
        var oscuro = v === 'oscuro' ||
          ((v === 'auto' || !v) && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Fondo animado cálido con auroras cobalto (decorativo) -->
  <div class="fondo-animado" aria-hidden="true">
    <span class="fondo-lineas"></span>
    <span class="fondo-orbe fondo-orbe--1"></span>
    <span class="fondo-orbe fondo-orbe--2"></span>
    <span class="fondo-orbe fondo-orbe--3"></span>
  </div>

  <!-- Cabecera contextual (saludo en Inicio, título + atrás en el resto) -->
  <header id="app-header" class="app-header">
    <button id="btn-atras" class="header-back" aria-label="Volver" hidden>‹</button>
    <h1 id="header-titulo" class="header-titulo">Kaixo, Ama <span class="emoji" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span></h1>
    <button id="btn-tema" class="header-tema" type="button" aria-label="Cambiar tema"></button>
  </header>

  <!-- Contenedor donde se renderiza cada pantalla -->
  <main id="vista" class="vista" role="main"></main>

  <!-- Marco rojo global + botón de parada mientras se graba (los gestiona recorder.js) -->
  <div id="marco-grabando" aria-hidden="true"></div>
  <button id="btn-parar-grabando" type="button" aria-label="Detener grabación">
    <span class="punto" aria-hidden="true"></span>
    <span data-parar-txt>0:00</span>
  </button>

  <!-- Navegación inferior -->
  <nav id="bottom-nav" class="bottom-nav" aria-label="Navegación principal">
    <button class="nav-item is-activa" data-ruta="inicio" aria-current="page">
      <svg class="nav-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/>
      </svg>
      <span class="nav-texto">Inicio</span>
    </button>
    <button class="nav-item" data-ruta="sesiones">
      <svg class="nav-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12h2l2-6 3 15 3-19 2.5 13 1.5-3H20"/>
      </svg>
      <span class="nav-texto">Sesiones</span>
    </button>
    <button class="nav-item" data-ruta="practica">
      <svg class="nav-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18"/><path d="M8 2.5v4M16 2.5v4"/><path d="M8.5 14h1.5M14 14h1.5M8.5 17.5h1.5M14 17.5h1.5"/>
      </svg>
      <span class="nav-texto">Práctica</span>
    </button>
    <button class="nav-item" data-ruta="grabaciones">
      <svg class="nav-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21M8.5 21h7"/>
      </svg>
      <span class="nav-texto">Grabaciones</span>
    </button>
    <span id="nav-indicador" class="nav-indicador" aria-hidden="true"></span>
  </nav>

</body>
